name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

permissions: {}

jobs:
  zizmor:
    name: zizmor via PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for upload-sarif to upload SARIF files to the code scanning
      # dashboard.
      security-events: write
      # Needed to clone the repo.
      contents: read
      # Needed for upload-sarif to read workflow run info.
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Install zizmor
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run zizmor
        run: zizmor --format=sarif .github action.yml > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif
          category: zizmor
